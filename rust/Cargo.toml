[package]
name = "mtc"
version = "1.6.0"
edition = "2021"

[lib]
name = "mtc"
path = "src/lib.rs"

[[bin]]
name = "mtcodec"
path = "src/main.rs"
required-features = ["raster"]

[[bin]]
name = "mtbench"
path = "src/bin/mtbench.rs"
required-features = ["raster"]

[[bin]]
name = "mtview"
path = "src/bin/mtview.rs"
required-features = ["viewer"]

[features]
# `raster` is what needs the image crate: reading and writing ordinary image
# files, and the PNG-alpha segment of early files. The codec itself does not, so
# the WebAssembly build turns it off.
default = ["raster"]
raster = ["dep:image"]
viewer = ["dep:eframe", "raster"]
# Build the viewer with eframe's off-screen screenshot hook, used by the build
# check: EFRAME_SCREENSHOT_TO=shot.png takes one frame and exits.
viewer-shot = ["viewer", "eframe/__screenshot"]

[dependencies]
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
eframe = { version = "0.27", optional = true, default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
